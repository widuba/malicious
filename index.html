<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sorry</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      background: red;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .wrap {
      color: white;
      width: 90vw;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 7rem);
      line-height: 1.1;
    }

    #countdown {
      margin-top: 1rem;
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>You didn’t answer my question.</h1>
    <div id="countdown">5</div>
  </div>

  <script>
    let count = 5;
    const countdownEl = document.getElementById("countdown");

    const timer = setInterval(() => {
      count--;
      countdownEl.textContent = count;

      if (count <= 0) {
        clearInterval(timer);

        // Create a hidden link and trigger download
        const link = document.createElement("a");
        link.href = "malicious.txt";
        link.download = "malicious.txt";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    }, 1000);
  </script>
</body>
</html>
